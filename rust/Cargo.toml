[package]
name = "tvplayer"
version = "0.3.9"
edition = "2021"
authors = ["miroiptv"]
license = "MIT"

[lib]
name = "tvplayer"
path = "src/lib.rs"

[[bin]]
name = "tvplayer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.27"
egui_extras = "0.27"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1"
async-trait = "0.1"
urlencoding = "2"
base64 = "0.22"

[dev-dependencies]
wiremock = "0.6"
insta = { version = "1", features = ["json"] }
proptest = "1"
tempfile = "3"
url = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "2"
